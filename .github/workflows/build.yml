name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ledger_platform_test
  SPRING_DATASOURCE_USERNAME: ledger_app
  SPRING_DATASOURCE_PASSWORD: ledger_app
  APP_ADMIN_USERNAME: ci-admin
  APP_ADMIN_PASSWORD: ci-admin-password
  RABBITMQ_HOST: localhost
  RABBITMQ_USERNAME: ledger_app
  RABBITMQ_PASSWORD: ledger_app

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ledger_app
          POSTGRES_PASSWORD: ledger_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger_app -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: ledger_app
          RABBITMQ_DEFAULT_PASS: ledger_app
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Create test database
        run: psql -h localhost -U "$SPRING_DATASOURCE_USERNAME" -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ledger_platform_test;'
        env:
          PGPASSWORD: ledger_app
      - name: Verify
        run: ./mvnw --batch-mode -Pmessaging-integration verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
