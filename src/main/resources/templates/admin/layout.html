<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="shell(pageTitle, activeNav, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle + ' | 交易账本管理平台'}">交易账本管理平台</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script defer th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
</head>
<body>
<div class="admin-shell">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-kicker">交易账本</span>
            <strong>管理平台</strong>
        </div>
        <nav aria-label="管理后台">
            <a th:href="@{/admin}" th:classappend="${activeNav == 'overview'} ? ' active'">经营概览</a>
            <a th:href="@{/admin/accounts}" th:classappend="${activeNav == 'accounts'} ? ' active'">客户账户</a>
            <a th:href="@{/admin/payments/top-up}" th:classappend="${activeNav == 'payments'} ? ' active'">资金操作</a>
            <a th:href="@{/admin/ledger}" th:classappend="${activeNav == 'ledger'} ? ' active'">账本流水</a>
            <a th:href="@{/admin/reconciliation}" th:classappend="${activeNav == 'reconciliation'} ? ' active'">自动对账</a>
            <a th:href="@{/admin/reconciliation/rules}" th:classappend="${activeNav == 'reconciliation-rules'} ? ' active'">对账规则</a>
            <a th:href="@{/admin/reconciliation/cases}" th:classappend="${activeNav == 'reconciliation-cases'} ? ' active'">异常工作台</a>
            <a th:href="@{/admin/audit}" th:classappend="${activeNav == 'audit'} ? ' active'">审计日志</a>
        </nav>
        <form class="logout-form" method="post" th:action="@{/logout}">
            <span sec:authentication="name">管理员</span>
            <button class="button button-quiet" type="submit">退出登录</button>
        </form>
    </aside>
    <div class="workspace">
        <header class="topbar">
            <span>管理后台</span>
            <strong th:text="${pageTitle}">页面</strong>
        </header>
        <th:block th:replace="${content}"></th:block>
    </div>
</div>
</body>
</html>
