<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: shell('账本流水', ${activeNav}, ~{::main})}">
<main class="content">
    <div class="page-heading">
        <div><p class="eyebrow">已入账分录</p><h1>账本流水</h1></div>
        <a id="refresh-ledger" class="button button-secondary" th:href="@{/admin/ledger}" hx-get="/admin/ledger" hx-target="#ledger-table" hx-swap="outerHTML">刷新</a>
    </div>
    <div id="ledger-table" class="table-section" th:fragment="ledgerTable">
        <div class="section-heading">
            <div><h2>近期账本流水</h2><p>最近100条已入账流水</p></div>
            <span class="result-count"><strong th:text="${#lists.size(transactions)}">0</strong> 条记录</span>
        </div>
        <div class="table-scroll">
            <table>
                <thead><tr><th>发生时间</th><th>业务流水号</th><th>类型</th><th class="numeric">交易金额</th></tr></thead>
                <tbody>
                <tr th:each="transaction : ${transactions}">
                    <td th:text="${#temporals.format(transaction.occurredAt, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 12:00:00</td>
                    <td class="mono" th:text="${transaction.businessReference}">REF-001</td>
                    <td th:text="${transaction.transactionTypeLabel}">充值</td>
                    <td class="numeric">人民币 <span th:text="${transaction.amount}">0.00</span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(transactions)}"><td colspan="4" class="empty-state">暂无已入账流水</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</html>
