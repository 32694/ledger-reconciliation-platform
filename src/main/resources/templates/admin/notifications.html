<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: shell('站内通知', ${activeNav}, ~{::main})}">
<main class="content">
    <div class="page-heading">
        <div><p class="eyebrow">业务事件提醒</p><h1>站内通知</h1></div>
        <a class="button button-secondary" th:href="@{/admin/notifications}">刷新</a>
    </div>

    <section class="table-section">
        <div class="section-heading">
            <div><h2>客户通知</h2><p>最多显示最近 100 条通知</p></div>
            <span class="result-count" th:text="${#lists.size(notifications) + ' 条记录'}">0 条记录</span>
        </div>
        <div class="table-scroll">
            <table>
                <thead><tr><th>状态</th><th>标题</th><th>通知内容</th><th>事件类型</th><th>业务对象</th><th>业务编号</th><th>创建时间</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="notification : ${notifications}" th:classappend="${notification.unread} ? ' notification-unread'">
                    <td><span class="status" th:classappend="${notification.unread} ? ' status-danger' : ' status-success'"
                              th:text="${notification.unread ? '未读' : '已读'}">未读</span></td>
                    <td th:text="${notification.title}">通知标题</td>
                    <td class="wrap-cell" th:text="${notification.content}">通知内容</td>
                    <td th:text="${notification.typeLabel}">支付成功</td>
                    <td th:text="${notification.aggregateTypeLabel}">资金操作</td>
                    <td class="mono wrap-cell" th:text="${notification.aggregateId}">aggregate-id</td>
                    <td th:text="${notification.createdAt}">2026-01-01T00:00:00Z</td>
                    <td>
                        <form class="inline-form" method="post" th:if="${notification.unread}"
                              th:action="@{/admin/notifications/{id}/read(id=${notification.id})}">
                            <button class="button button-secondary" type="submit">标记已读</button>
                        </form>
                        <span th:if="${!notification.unread}">--</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(notifications)}"><td colspan="8" class="empty-state">暂无站内通知</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</html>
