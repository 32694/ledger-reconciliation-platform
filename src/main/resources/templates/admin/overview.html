<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: shell('经营概览', ${activeNav}, ~{::main})}">
<main class="content">
    <div class="page-heading">
        <div>
            <p class="eyebrow">当前经营状况</p>
            <h1>经营概览</h1>
        </div>
        <div class="actions">
            <a class="button button-secondary" th:href="@{/admin/accounts/new}">新建账户</a>
            <a class="button button-secondary" th:href="@{/admin/payments/top-up}">账户充值</a>
            <a class="button button-primary" th:href="@{/admin/payments/transfer}">账户转账</a>
        </div>
    </div>

    <section class="metrics" aria-label="平台概览">
        <article>
            <span>客户账户总数</span>
            <strong th:text="${accountCount}">0</strong>
        </article>
        <article>
            <span>客户总余额</span>
            <strong>人民币 <span th:text="${customerBalance}">0.00</span></strong>
        </article>
        <article>
            <span>近期资金操作笔数</span>
            <strong th:text="${#lists.size(recentPayments)}">0</strong>
        </article>
    </section>

    <section class="metrics reconciliation-metrics" aria-label="对账运营概览">
        <a id="reconciliation-match-rate" class="metric-link"
           th:href="${reconciliationOperations.latestCompletedBatchId != null} ? @{/admin/reconciliation/{id}(id=${reconciliationOperations.latestCompletedBatchId})} : @{/admin/reconciliation}">
            <span>最近匹配率</span>
            <strong th:text="${reconciliationOperations.completedMatchRate != null ? #numbers.formatDecimal(reconciliationOperations.completedMatchRate, 1, 1) + '%' : '--'}">--</strong>
        </a>
        <a id="reconciliation-open" class="metric-link"
           th:href="@{/admin/reconciliation/cases(resolutionStatus='OPEN')}">
            <span>待认领异常</span>
            <strong th:text="${reconciliationOperations.openCount}">0</strong>
        </a>
        <a id="reconciliation-claimed" class="metric-link"
           th:href="@{/admin/reconciliation/cases(resolutionStatus='CLAIMED')}">
            <span>处理中异常</span>
            <strong th:text="${reconciliationOperations.claimedCount}">0</strong>
        </a>
        <a id="reconciliation-failed" class="metric-link"
           th:href="@{/admin/reconciliation(runStatus='FAILED')}">
            <span>失败对账任务</span>
            <strong th:text="${reconciliationOperations.failedRunCount}">0</strong>
        </a>
    </section>

    <section class="table-section">
        <div class="section-heading">
            <div>
                <h2>近期资金操作</h2>
                <p>最近处理的充值、转账及反向操作</p>
            </div>
            <a class="text-link" th:href="@{/admin/payments/top-up}">资金操作</a>
        </div>
        <div class="table-scroll">
            <table>
                <thead><tr><th>业务流水号</th><th>类型</th><th class="numeric">金额</th><th>状态</th></tr></thead>
                <tbody>
                <tr th:each="payment : ${recentPayments}">
                    <td><a class="text-link mono" th:href="@{/admin/payments/{id}(id=${payment.id})}"
                           th:text="${payment.channelReference}">PAY-001</a></td>
                    <td th:text="${payment.typeLabel}">充值</td>
                    <td class="numeric">人民币 <span th:text="${payment.amount}">0.00</span></td>
                    <td><span class="status" th:classappend="${payment.status == 'SUCCEEDED'} ? ' status-success' : ' status-danger'" th:text="${payment.statusLabel}">成功</span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(recentPayments)}"><td colspan="4" class="empty-state">暂无资金操作记录</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</html>
