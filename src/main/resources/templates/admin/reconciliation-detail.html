<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: shell('对账批次详情', ${activeNav}, ~{::main})}">
<main class="content">
    <div class="page-heading">
        <div>
            <p class="eyebrow">对账批次</p>
            <h1 th:text="${batch.fileName}">statement.csv</h1>
        </div>
        <div class="actions">
            <form th:if="${canRun}" method="post" th:action="@{/admin/reconciliation/{id}/run(id=${batch.id})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="button button-primary" type="submit">开始对账</button>
            </form>
            <a class="button button-secondary" th:href="@{/admin/reconciliation}">返回批次</a>
        </div>
    </div>
    <section class="metrics">
        <article><span>批次状态</span><strong th:text="${batch.statusLabel}">待对账</strong></article>
        <article><span>总行数</span><strong th:text="${batch.totalRows}">0</strong></article>
        <article><span>匹配笔数</span><strong th:text="${batch.matchedRows}">0</strong></article>
        <article><span>差异笔数</span><strong th:text="${batch.differenceRows}">0</strong></article>
    </section>
    <p class="alert alert-error" th:if="${batch.errorMessage}" th:text="${batch.errorMessage}">批次失败</p>
    <section class="table-section">
        <div class="section-heading">
            <div><h2>对账结果</h2><p>精确匹配渠道流水号与金额</p></div>
            <form class="filter-form" method="get" th:action="@{/admin/reconciliation/{id}(id=${batch.id})}">
                <select name="resultType" aria-label="结果类型">
                    <option value="">全部结果</option>
                    <option th:each="type : ${resultTypes}" th:value="${type}" th:text="${type}" th:selected="${selectedResultType == type.name()}">MATCHED</option>
                </select>
                <select name="resolutionStatus" aria-label="处理状态">
                    <option value="">全部状态</option>
                    <option th:each="status : ${resolutionStatuses}" th:value="${status}" th:text="${status}" th:selected="${selectedResolutionStatus == status.name()}">OPEN</option>
                </select>
                <button class="button button-secondary" type="submit">筛选</button>
            </form>
        </div>
        <div class="table-scroll">
            <table>
                <thead><tr><th>渠道流水号</th><th>结果</th><th class="numeric">渠道金额</th><th class="numeric">内部金额</th><th>处理状态</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="result : ${results}">
                    <td class="mono" th:text="${result.channelTransactionId != null ? result.channelTransactionId : result.paymentId}">CHANNEL-001</td>
                    <td th:text="${result.resultTypeLabel}">匹配一致</td>
                    <td class="numeric" th:text="${result.channelAmountCents != null ? result.channelAmountCents : '-'}">-</td>
                    <td class="numeric" th:text="${result.internalAmountCents != null ? result.internalAmountCents : '-'}">-</td>
                    <td th:text="${result.resolutionLabel}">无需处理</td>
                    <td>
                        <form th:if="${result.resolutionStatus.name() == 'OPEN'}" method="post" th:action="@{/admin/reconciliation/results/{id}/resolve(id=${result.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input name="note" required maxlength="2000" placeholder="填写处理备注" aria-label="处理备注">
                            <button class="button button-secondary" type="submit">标记已处理</button>
                        </form>
                        <span th:if="${result.resolutionStatus.name() != 'OPEN'}" th:text="${result.resolutionNote}">-</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(results)}"><td colspan="6" class="empty-state">暂无对账结果</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</html>
