<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: shell('对账规则', ${activeNav}, ~{::main})}">
<main class="content">
    <div class="page-heading">
        <div>
            <p class="eyebrow">规则配置</p>
            <h1>对账规则</h1>
        </div>
    </div>
    <p class="alert alert-success" th:if="${ruleSuccess}" th:text="${ruleSuccess}">操作成功</p>
    <p class="alert alert-error" th:if="${ruleError}" th:text="${ruleError}">操作失败</p>
    <section class="table-section">
        <div class="section-heading">
            <div>
                <h2>规则与渠道</h2>
                <p>渠道未发布专用版本时继承默认规则</p>
            </div>
            <span class="result-count" th:text="${#lists.size(rules) + ' 条规则'}">0 条规则</span>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>规则</th>
                    <th>适用范围</th>
                    <th>生效版本</th>
                    <th class="numeric">金额容差（元）</th>
                    <th class="numeric">查询窗口（小时）</th>
                    <th>草稿状态</th>
                    <th>渠道状态</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rule : ${rules}">
                    <td th:text="${rule.title}">默认规则</td>
                    <td th:text="${rule.scopeLabel}">全局默认</td>
                    <td th:text="${rule.activeVersionLabel}">版本 1</td>
                    <td class="numeric" th:text="${rule.amountLabel}">0.00 元</td>
                    <td class="numeric" th:text="${rule.windowLabel}">0 小时</td>
                    <td>
                        <span class="status" th:classappend="${rule.hasDraft} ? ' status-danger' : ' status-success'"
                              th:text="${rule.draftStatusLabel}">无待发布草稿</span>
                        <small class="pending-parameters" th:if="${rule.hasDraft}"
                               th:text="${'待发布参数：' + rule.pendingSummary}">待发布参数：0.00 元 / 0 小时</small>
                    </td>
                    <td>
                        <span class="status" th:if="${rule.channelActive != null}"
                              th:classappend="${rule.channelActive} ? ' status-success' : ' status-danger'"
                              th:text="${rule.channelStatusLabel}">启用</span>
                        <span th:if="${rule.channelActive == null}">--</span>
                        <form class="inline-form" method="post" th:if="${rule.channelActive != null}"
                              th:action="@{/admin/reconciliation/channels/{code}/status(code=${rule.channelCode})}">
                            <input type="hidden" name="active" th:value="${!rule.channelActive}">
                            <button class="button button-secondary" type="submit"
                                    th:text="${rule.channelActive ? '停用渠道' : '启用渠道'}">停用渠道</button>
                        </form>
                    </td>
                    <td>
                        <div class="table-actions">
                            <a class="text-link" th:href="@{/admin/reconciliation/rules/{id}/edit(id=${rule.id})}">编辑</a>
                            <a class="text-link" th:href="@{/admin/reconciliation/rules/{id}/history(id=${rule.id})}">历史版本</a>
                            <form class="inline-form" method="post" th:if="${rule.hasDraft}"
                                  th:action="@{/admin/reconciliation/rules/{id}/publish(id=${rule.id})}">
                                <span class="pending-parameters" th:text="${'待发布参数：' + rule.pendingSummary}">待发布参数</span>
                                <button class="button button-primary" type="submit">发布</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rules)}"><td colspan="8" class="empty-state">暂无对账规则</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</html>
