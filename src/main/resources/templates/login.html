<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrator sign in</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="login-page">
<main class="login-panel">
    <p class="product-mark">Ledger Operations</p>
    <h1>Administrator sign in</h1>
    <p class="alert alert-error" th:if="${param.error}" role="alert">Invalid username or password.</p>
    <p class="alert alert-success" th:if="${param.logout}" role="status">You have signed out.</p>
    <form method="post" th:action="@{/login}">
        <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button button-primary button-full" type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
