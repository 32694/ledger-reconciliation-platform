<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理员登录</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="login-page">
<main class="login-panel">
    <p class="product-mark">交易账本管理平台</p>
    <h1>管理员登录</h1>
    <p class="alert alert-error" th:if="${param.error}" role="alert">用户名或密码错误</p>
    <p class="alert alert-success" th:if="${param.logout}" role="status">已退出登录</p>
    <form method="post" th:action="@{/login}">
        <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button button-primary button-full" type="submit">登录</button>
    </form>
</main>
</body>
</html>
